# --- Font ---
font_family      JetBrains Mono 
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# --- Clean window ---
# hide_window_decorations yes
window_padding_width    10
confirm_os_window_close 0

# --- Transparency (no blur) ---
background_opacity 0.89

# --- Cursor ---
cursor_shape       block
cursor_blink_interval 0

# --- Cursor trail ---
# Higher value = longer trail (0 disables it)
cursor_trail                 3
# Decay times (fast, slow); lower = trail fades sooner
cursor_trail_decay           0.1 0.4
# Minimum distance in cells before the trail appears
cursor_trail_start_threshold 2

# --- Colors (olive / plum, adjust to taste) ---
foreground            #e6e1ea
background            #1a1620
selection_foreground  #1a1620
selection_background  #d9a6e8
cursor                #ff8de0
color0  #2a2530
color8  #5a5062
color1  #e0708a
color9  #f08aa0
color2  #8fcf6a
color10 #a8e085
color3  #c9b458
color11 #ddc96e
color4  #7a8fe0
color12 #94a8f5
color5  #c07ae0
color13 #d594f5
color6  #6fd6d0
color14 #8fece6
color7  #d8d2de
color15 #ffffff

# --- Tabs (similar to Konsole) ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
active_tab_foreground   #1a1620
active_tab_background   #d9a6e8
inactive_tab_foreground #e6e1ea
inactive_tab_background #3a3142

# --- Behavior ---
scrollback_lines      20000
copy_on_select        clipboard
strip_trailing_spaces smart
enable_audio_bell     no
enabled_layouts       splits,stack
shell_integration     enabled

# --- Konsole-style shortcuts ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# --- Splits ---
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# --- Scrollback in a searchable viewer (press / inside to search) ---
map ctrl+shift+h show_scrollback
